# Publie les posts Instagram de social/queue.json arrivés à leur heure (voir social/publish.mjs).
name: Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node social/publish.mjs
        env:
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
