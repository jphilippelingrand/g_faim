# Publier une nouvelle version iOS : poser un tag de version sur main et le pousser.
#   git tag v1.0.1 && git push origin v1.0.1
# → build de production chez EAS (version 1.0.1, lue dans le tag), puis envoi sur App Store Connect / TestFlight.
# Prérequis : repo GitHub relié au projet EAS (base directory : app) et un premier build + submit
# lancés en local (certificats et clé App Store Connect stockés chez EAS).
name: Release iOS

on:
  push:
    tags: ['v*']

jobs:
  build_ios:
    name: Build iOS (production)
    type: build
    env:
      # Lu par app.config.ts : « v1.0.1 » → version 1.0.1.
      APP_VERSION: ${{ github.ref_name }}
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Envoi App Store Connect
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
